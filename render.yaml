# Test site on Render (Blueprint). Singapore is Render's closest region to India.
# Render dashboard → New → Blueprint → pick this repo. It asks for the values marked
# sync: false; everything else is filled in or generated here. Secrets never live in git.
# See docs/test-site.md for the step-by-step.

databases:
  - name: hrms-test-db
    region: singapore
    plan: basic-256mb
    databaseName: hrms
    user: hrms

services:
  - type: web
    name: hrms-test-api
    runtime: node
    region: singapore
    # A paid instance: uploaded documents need a disk, and the web app reaches the
    # API over Render's private network, which free instances can't receive on.
    plan: starter
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @hrms/shared build && pnpm --filter @hrms/api build
    # Migrations, then the demo workspace (skipped once it exists), then the API.
    startCommand: >-
      cd apps/api && npx prisma migrate deploy &&
      if [ "$SEED_DEMO" = true ]; then node dist/seed/demo.js; fi &&
      node dist/main.js
    healthCheckPath: /api/health
    disk:
      name: documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: API_PORT
        value: '10000'
      - key: DATABASE_URL
        fromDatabase:
          name: hrms-test-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # 32 random bytes, base64. Copy it from the dashboard into a password manager:
      # without it, encrypted PAN and bank details can't be read back.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_DIR
        value: /var/data/documents
      - key: SEED_DEMO
        value: 'true'
      # The web app's public address (links in emails). Change it if Render gives the
      # web service a different name.
      - key: APP_URL
        value: https://hrms-test-web.onrender.com
      - key: WEB_ORIGIN
        value: https://hrms-test-web.onrender.com
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_API_KEY
        sync: false
      # resend.dev can only deliver to your own Resend login email until you verify a domain.
      - key: EMAIL_FROM
        value: HRMS Test <onboarding@resend.dev>

  - type: web
    name: hrms-test-web
    runtime: node
    region: singapore
    plan: free
    buildCommand: >-
      corepack enable && pnpm install --frozen-lockfile &&
      pnpm --filter @hrms/shared build && pnpm --filter @hrms/web build &&
      cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static &&
      cp -r apps/web/public apps/web/.next/standalone/apps/web/public
    startCommand: node apps/web/.next/standalone/apps/web/server.js
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: HOSTNAME
        value: 0.0.0.0
      # Private address of the API (host:port); next.config adds http://.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: hrms-test-api
          property: hostport
