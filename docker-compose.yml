# Full stack locally: docker compose up --build
# Then open http://localhost:3000 and create a workspace (or run the seed, see README).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: hrms
      POSTGRES_DB: hrms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hrms']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://hrms:hrms@db:5432/hrms?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-secret-change-me-0123456789abcdef}
      # Set your own for anything beyond local testing: openssl rand -base64 32
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-bG9jYWwtZGV2LW9ubHkta2V5LWNoYW5nZS1tZS0hISE=}
      APP_URL: http://localhost:3000
      WEB_ORIGIN: http://localhost:3000
      API_PORT: 4000
    volumes:
      - documents:/data/documents
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  pgdata:
  documents:
