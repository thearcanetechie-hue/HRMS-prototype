<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HRMS Workspace Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — glass sidebar, top bar, depth cards on a black ground lit by soft orange glows */
:root{
  color-scheme: dark;
  --bg:#08080a; --bg2:#0e0e11;
  --surf:#151518; --surf2:#1b1b1f; --surf3:#232328;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --fg:#f3f1ee; --body:#c8c4bf; --muted:#8b8680; --faint:#5c5854;
  --acc:#ff6b00; --acc2:#ff9a4d; --acc-rgb:255,107,0; --acc-ink:#1b0b00;
  --good:#3ecf8e; --warn:#f5b83d; --bad:#ff5d5d;
  --f-display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --f-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
#app{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(600px 420px at 85% -5%, rgba(var(--acc-rgb),.22), transparent 70%),
             radial-gradient(520px 520px at -5% 105%, rgba(var(--acc-rgb),.12), transparent 70%),
             radial-gradient(900px 500px at 50% 120%, rgba(255,255,255,.03), transparent 70%);}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc2)}
.muted{color:var(--muted)}
a{color:var(--acc2)}
:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}

/* ---------- Glass buttons ---------- */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;
  color:var(--fg);border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
  backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.35), 0 8px 20px -10px rgba(0,0,0,.8), 0 2px 4px rgba(0,0,0,.35);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;overflow:hidden}
.btn::before{content:"";position:absolute;inset:1px 1px 50% 1px;border-radius:11px 11px 6px 6px;z-index:-1;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));opacity:.7}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.35), 0 14px 26px -12px rgba(0,0,0,.9), 0 3px 6px rgba(0,0,0,.4)}
.btn:active{transform:translateY(1px);box-shadow:inset 0 2px 6px rgba(0,0,0,.45), 0 2px 6px -2px rgba(0,0,0,.6)}
.btn-primary{color:var(--acc-ink);border-color:rgba(255,210,170,.55);
  background:linear-gradient(135deg, color-mix(in srgb, var(--acc2) 92%, white 8%) 0%, rgba(var(--acc-rgb),.92) 52%, color-mix(in srgb, var(--acc) 75%, black 25%) 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 8px rgba(90,25,0,.35), 0 12px 28px -10px rgba(var(--acc-rgb),.75), 0 2px 5px rgba(0,0,0,.45)}
.btn-primary::before{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));opacity:.55}
.btn-primary:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.55), inset 0 -3px 8px rgba(90,25,0,.35), 0 16px 34px -10px rgba(var(--acc-rgb),.9), 0 3px 6px rgba(0,0,0,.45)}
.btn-danger{border-color:rgba(255,120,120,.35);background:linear-gradient(180deg,rgba(255,93,93,.28),rgba(255,93,93,.08))}
.btn-good{border-color:rgba(62,207,142,.4);background:linear-gradient(180deg,rgba(62,207,142,.3),rgba(62,207,142,.08))}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn-sm::before{border-radius:9px 9px 5px 5px}
.btn-lg{padding:14px 22px;font-size:15px;border-radius:14px}
.btn-block{width:100%}
.icon-btn{width:40px;height:40px;padding:0;border-radius:12px}

/* ---------- Depth cards ---------- */
.card{position:relative;border-radius:var(--r-lg);padding:20px;
  background:linear-gradient(180deg,var(--surf2) 0%,var(--surf) 60%, #121215 100%);
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.5), 0 12px 24px -12px rgba(0,0,0,.7), 0 30px 60px -30px rgba(0,0,0,.8);
  transition:transform .2s ease, box-shadow .2s ease;min-width:0}
.card.lift:hover{transform:translateY(-3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.5), 0 2px 4px rgba(0,0,0,.5), 0 20px 36px -14px rgba(0,0,0,.8), 0 40px 70px -30px rgba(var(--acc-rgb),.18)}
.card.hot{background:linear-gradient(145deg, var(--acc2) 0%, var(--acc) 55%, color-mix(in srgb, var(--acc) 70%, black 30%) 100%);color:var(--acc-ink);border-color:rgba(255,220,190,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 10px rgba(80,20,0,.35), 0 20px 40px -18px rgba(var(--acc-rgb),.6)}
.card.hot .muted{color:rgba(27,11,0,.7)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{font-size:16px;font-weight:600}
.inset{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:inset 0 2px 6px rgba(0,0,0,.45)}

/* ---------- Pills / chips ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--body)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);border-color:rgba(62,207,142,.3);background:rgba(62,207,142,.08)}
.pill.warn{color:var(--warn);border-color:rgba(245,184,61,.3);background:rgba(245,184,61,.08)}
.pill.bad{color:var(--bad);border-color:rgba(255,93,93,.3);background:rgba(255,93,93,.08)}
.pill.acc{color:var(--acc2);border-color:rgba(var(--acc-rgb),.35);background:rgba(var(--acc-rgb),.1)}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;font-weight:600;font-size:12.5px;color:var(--body)}
.chip[aria-pressed="true"]{background:rgba(var(--acc-rgb),.16);border-color:rgba(var(--acc-rgb),.5);color:var(--fg)}

/* ---------- Forms ---------- */
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--body)}
.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.35);box-shadow:inset 0 2px 5px rgba(0,0,0,.45);outline:none;transition:border-color .15s, box-shadow .15s}
.input:focus{border-color:rgba(var(--acc-rgb),.7);box-shadow:inset 0 2px 5px rgba(0,0,0,.45), 0 0 0 3px rgba(var(--acc-rgb),.18)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.err{color:var(--bad);font-size:12px;min-height:16px}

/* ---------- Auth ---------- */
.auth{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding-block:40px;padding-inline:max(16px,5vw)}
.auth-hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;font-weight:700}
.auth-hero h1 span{background:linear-gradient(135deg,var(--acc2),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-hero p:not(.eyebrow){color:var(--body);max-width:46ch;font-size:16px;margin:18px 0 26px}
.auth-points{display:grid;gap:10px;max-width:440px}
.auth-points div{display:flex;gap:10px;align-items:center;color:var(--body)}
.auth-points b{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(var(--acc-rgb),.15);color:var(--acc2);font-size:12px;border:1px solid rgba(var(--acc-rgb),.35);flex:none}
.glass-card{border-radius:24px;padding:30px;max-width:430px;width:100%;justify-self:center;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.025));border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 40px 80px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.4)}
.glass-card h2{font-size:24px}
.glass-card form{display:grid;gap:14px;margin-top:20px}
.orb{position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none;z-index:-1}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--acc-ink);font-weight:800;
  background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -6px rgba(var(--acc-rgb),.7)}
.sample-note{font-size:11.5px;color:var(--faint);margin-top:14px;text-align:center}

/* ---------- Shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));border-right:1px solid var(--line);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav{display:grid;gap:3px;overflow:auto}
.nav-label{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--faint);padding:10px 12px 4px}
.nav button{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;border:1px solid transparent;background:none;color:var(--body);font-weight:600;cursor:pointer;text-align:left}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--fg)}
.nav button[aria-current="page"]{color:var(--fg);border-color:rgba(var(--acc-rgb),.35);
  background:linear-gradient(90deg,rgba(var(--acc-rgb),.2),rgba(var(--acc-rgb),.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 6px 16px -10px rgba(var(--acc-rgb),.6)}
.nav button[aria-current="page"] svg{color:var(--acc2)}
.nav .count{margin-left:auto;font-size:11px;background:var(--acc);color:var(--acc-ink);border-radius:999px;padding:0 7px;font-weight:800}
.side-foot{margin-top:auto}
.role-switch{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:13px;gap:4px}
.role-switch button{padding:8px;border-radius:10px;border:0;background:none;color:var(--muted);font-weight:700;cursor:pointer}
.role-switch button[aria-pressed="true"]{color:var(--acc-ink);background:linear-gradient(135deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 6px 14px -6px rgba(var(--acc-rgb),.7)}
.main{min-width:0;padding-block:18px 60px;padding-inline:clamp(16px,2.6vw,34px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.search{flex:1;max-width:460px;position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:38px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--acc-ink);flex:none;
  background:linear-gradient(135deg,#ffd0a8,var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -8px rgba(0,0,0,.8)}
.avatar.sm{width:32px;height:32px;border-radius:10px;font-size:11.5px}
.avatar.alt{background:linear-gradient(135deg,#3a3a42,#26262b);color:var(--fg)}
.menu-btn{display:none}
.bell{position:relative}
.bell .dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--bg),0 0 10px rgba(var(--acc-rgb),.9)}

.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:clamp(24px,3vw,32px);font-weight:600}
.page-h p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}

.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.span2{grid-column:span 2}

.kpi .label{font-size:12.5px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.kpi .value{font-family:var(--f-display);font-size:34px;font-weight:600;margin:6px 0 2px;letter-spacing:-.02em}
.kpi .delta{font-size:12px;font-weight:700}
.kpi.hot .label,.kpi.hot .delta{color:rgba(27,11,0,.75)}
.kpi-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(var(--acc-rgb),.14);color:var(--acc2);border:1px solid rgba(var(--acc-rgb),.3)}
.kpi.hot .kpi-ico{background:rgba(0,0,0,.14);color:var(--acc-ink);border-color:rgba(0,0,0,.15)}

.list{display:grid;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid var(--line);transition:background .15s}
.row:hover{background:rgba(255,255,255,.045)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700}
.row .s{font-size:12.5px;color:var(--muted)}
.row .act{display:flex;gap:8px;flex:none}

.bars{display:flex;align-items:flex-end;gap:6px;height:150px;padding:14px 12px 0}
.bars .b{flex:1;border-radius:7px 7px 3px 3px;position:relative;min-width:0;
  background:linear-gradient(180deg,rgba(var(--acc-rgb),.9),rgba(var(--acc-rgb),.25));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.bars .b.low{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.06))}
.bars .b.today{background:linear-gradient(180deg,var(--acc2),var(--acc));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 18px rgba(var(--acc-rgb),.55)}
.bar-x{display:flex;gap:6px;padding:6px 12px 0}
.bar-x span{flex:1;text-align:center;font-size:10.5px;color:var(--faint);font-family:var(--f-mono)}

.meter{height:9px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 1px 3px rgba(0,0,0,.6);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}

table{width:100%;border-collapse:separate;border-spacing:0}
.tbl-wrap{overflow-x:auto;border-radius:16px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.03)}
.who{display:flex;align-items:center;gap:10px}
.who .n{font-weight:700}
.who .e{font-size:12px;color:var(--muted)}

.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.step{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02);position:relative}
.step .k{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.step .t{font-weight:700;margin-top:4px;font-size:13px}
.step.done{border-color:rgba(62,207,142,.35);background:rgba(62,207,142,.06)}
.step.done .k{color:var(--good)}
.step.now{border-color:rgba(var(--acc-rgb),.6);background:rgba(var(--acc-rgb),.12);box-shadow:0 0 0 3px rgba(var(--acc-rgb),.12), 0 10px 24px -12px rgba(var(--acc-rgb),.6)}
.step.now .k{color:var(--acc2)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:10.5px;text-align:center;color:var(--faint);font-weight:800;letter-spacing:.08em}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-family:var(--f-mono);background:rgba(255,255,255,.025);border:1px solid var(--line);position:relative}
.cal .d.off{opacity:.25}
.cal .d.we{color:var(--faint)}
.cal .d.hol{background:rgba(var(--acc-rgb),.16);border-color:rgba(var(--acc-rgb),.45);color:var(--fg)}
.cal .d.lv::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.cal .d.today{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);font-weight:700;box-shadow:0 6px 16px -6px rgba(var(--acc-rgb),.8)}

.toggle{position:relative;width:44px;height:26px;border-radius:99px;border:1px solid var(--line2);background:rgba(0,0,0,.4);box-shadow:inset 0 2px 4px rgba(0,0,0,.5);cursor:pointer;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#f2f2f2,#b9b9b9);box-shadow:0 2px 5px rgba(0,0,0,.6);transition:transform .2s}
.toggle[aria-checked="true"]{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:rgba(255,210,170,.5)}
.toggle[aria-checked="true"]::after{transform:translateX(18px)}

.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:12px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 14px -6px rgba(0,0,0,.8)}
.sw[aria-pressed="true"]{border-color:#fff}

.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.flow .node{padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);font-weight:700;font-size:13px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.flow .node.a{border-color:rgba(var(--acc-rgb),.5);background:rgba(var(--acc-rgb),.12)}
.flow .arr{color:var(--acc2);font-weight:800}

/* Work hub */
.checkin{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.clock{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:-.02em}
.big-round{width:150px;height:150px;border-radius:50%;font-size:16px;flex-direction:column;gap:4px}
.big-round::before{inset:2px 2px 50% 2px;border-radius:999px 999px 20px 20px}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{flex:1;min-width:64px;padding:12px 6px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.03);cursor:pointer;display:grid;justify-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--body)}
.mood svg{width:26px;height:26px}
.mood[aria-pressed="true"]{border-color:rgba(var(--acc-rgb),.6);background:rgba(var(--acc-rgb),.14);color:var(--fg);box-shadow:0 8px 20px -10px rgba(var(--acc-rgb),.7)}
.task{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.task input{width:18px;height:18px;accent-color:var(--acc)}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.post{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.post .meta{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.post p{margin:0;color:var(--body)}
.post .re{display:flex;gap:8px;margin-top:10px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.app{display:grid;justify-items:center;gap:8px;padding:14px 6px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer;font-size:12px;font-weight:700;color:var(--body);text-decoration:none}
.app:hover{background:rgba(255,255,255,.05);color:var(--fg)}
.app i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px -6px rgba(0,0,0,.8)}

/* Modal / drawer */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;overflow:auto;padding:26px;padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#19191d,#111114);border-left:1px solid var(--line2);box-shadow:-30px 0 60px -20px rgba(0,0,0,.9);animation:slide .25s ease}
.drawer form{display:grid;gap:14px;margin-top:18px}
@keyframes slide{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Toast */
.toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;display:grid;gap:8px}
.toast{padding:12px 16px;border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center;
  background:linear-gradient(160deg,rgba(40,40,46,.92),rgba(22,22,26,.92));border:1px solid var(--line2);backdrop-filter:blur(14px);box-shadow:0 20px 40px -16px rgba(0,0,0,.9);animation:pop .25s ease}
.toast b{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);font-size:12px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

/* AI assistant */
.ai-fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:18px;padding:13px 18px}
.ai-panel{position:fixed;right:22px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;width:min(380px,calc(100vw - 32px));max-height:min(560px,70vh);display:flex;flex-direction:column;
  border-radius:22px;background:linear-gradient(160deg,rgba(34,34,40,.92),rgba(16,16,19,.94));border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 40px 80px -24px rgba(0,0,0,.95),0 0 0 1px rgba(0,0,0,.5);animation:pop .2s ease}
.ai-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ai-body{padding:14px 16px;overflow:auto;display:grid;gap:10px;flex:1}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;font-size:13.5px}
.msg.me{justify-self:end;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);font-weight:600}
.msg.bot{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--body)}
.ai-sugs{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.ai-form{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line)}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-dash{grid-template-columns:1fr}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:60;width:260px;height:auto;transform:translateX(-105%);transition:transform .25s;background:#101013}
  .side.open{transform:none;box-shadow:30px 0 60px rgba(0,0,0,.8)}
  .menu-btn{display:inline-flex}
  .auth{grid-template-columns:1fr}
  .auth-hero p{font-size:15px}
  .stepper{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3{grid-template-columns:1fr}
  .span2{grid-column:auto}
  .search{display:none}
}
@media (max-width:520px){.g4{grid-template-columns:1fr 1fr}.kpi .value{font-size:26px}.apps{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}.row{flex-wrap:wrap}.top-right .btn-hide{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  <div class="grid g-dash"><div class="grid" style="align-content:start">
    <div class="card"><form id="postForm" style="display:grid;gap:10px"><label for="postText" class="eyebrow">Share something good</label><textarea class="input" id="postText" rows="3" placeholder="A win, a thank-you, a new joiner…"></textarea><div style="display:flex;justify-content:flex-end"><button class="btn btn-primary" type="submit">${ico('send',15)} Post</button></div></form></div>
    ${S.posts.map((p,i)=>`<div class="card post"><div class="meta"><div class="avatar sm">${p.init}</div><div><div style="font-weight:700">${esc(p.who)}</div><div class="muted" style="font-size:12px">${p.time}</div></div></div><p>${esc(p.text)}</p><div class="re"><button class="btn btn-sm" data-like="${i}">${ico('heart',14)} ${p.likes}</button><button class="btn btn-sm" data-act="reply">Reply</button></div></div>`).join('')}
  </div>
  <div class="card"><div class="card-h"><h3>Rate a company initiative</h3></div><p class="muted" style="margin-top:0">"Hybrid Fridays" pilot, week 3</p>
    <div class="moods">${[['great','Love it'],['okay','Neutral'],['low','Not for me']].map(([k,l])=>`<button class="mood" data-act="rate">${face(k)}${l}</button>`).join('')}</div>
    <p class="muted" style="font-size:12px;margin:12px 0 0">Anonymous. HR sees themes, not names.</p></div></div>`;
}

// ---------- Drawers ----------
function empDrawer(){
  return `<div class="scrim" data-close="1"><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dt">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2 id="dt" style="font-size:22px">Add employee</h2><button class="btn icon-btn" data-close="1" aria-label="Close">${ico('x')}</button></div>
    <p class="muted" style="margin:4px 0 0">They'll get an invite to the employee app and an onboarding checklist.</p>
    <form id="empForm" novalidate>
      <div class="field"><label for="fn">Full name</label><input class="input" id="fn" placeholder="e.g. Aditi Pradhan"></div>
      <div class="field"><label for="fe">Work email</label><input class="input" id="fe" type="email" placeholder="aditi@comilo.com"></div>
      <div class="two"><div class="field"><label for="fd">Department</label><select class="input" id="fd">${['Engineering','Design','Sales','HR','Finance','Operations'].map(d=>`<option>${d}</option>`).join('')}</select></div>
      <div class="field"><label for="fl">Location</label><select class="input" id="fl"><option>Bhubaneswar</option><option>Cuttack</option><option>Kolkata</option><option>Pune</option><option>Remote</option></select></div></div>
      <div class="two"><div class="field"><label for="fr">Job title</label><input class="input" id="fr" placeholder="Frontend Developer"></div>
      <div class="field"><label for="fj">Joining date</label><input class="input" id="fj" type="date" value="2026-10-06"></div></div>
      <div class="field"><label for="fc">Annual CTC (₹)</label><input class="input num" id="fc" inputmode="numeric" placeholder="9,00,000"></div>
      ${S.fields.map((f,i)=>`<div class="field"><label for="cf${i}">${esc(f)} <span class="muted">(custom field)</span></label><input class="input" id="cf${i}"></div>`).join('')}
      <div class="err" id="empErr"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" type="button" data-close="1">Cancel</button><button class="btn btn-primary" type="submit">${ico('check',16)} Add and send invite</button></div>
    </form></aside></div>`;
}
function aiPanel(){
  const sugs = S.role==='hr'?['Who is on leave next week?','Which compliance filings are due?','Why did net pay rise for Vikram?']:['How many leaves do I have?','Apply sick leave for tomorrow','When is my next payday?'];
  return `<div class="ai-panel" role="dialog" aria-label="AI assistant">
    <div class="ai-head"><div class="logo" style="width:30px;height:30px;border-radius:9px">${ico('spark',16)}</div><div style="flex:1"><div style="font-weight:700">HR Assistant</div><div class="muted" style="font-size:11.5px">Only ${esc(S.company)} data you can see</div></div><button class="btn icon-btn btn-sm" data-act="ai" aria-label="Close assistant">${ico('x',15)}</button></div>
    <div class="ai-body" id="aiBody">${S.aiMsgs.map(m=>`<div class="msg ${m.r}">${m.t}</div>`).join('')}</div>
    <div class="ai-sugs">${sugs.map(s=>`<button class="chip" data-ask="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <form class="ai-form" id="aiForm"><input class="input" id="aiIn" placeholder="Ask or give a task…" aria-label="Message"><button class="btn btn-primary icon-btn" type="submit" aria-label="Send">${ico('send',16)}</button></form>
  </div>`;
}
const AI = {
  'Who is on leave next week?':'3 people: <b>Rohan Patnaik</b> (2–3 Oct, casual, pending), <b>Arjun Mohanty</b> (until 3 Oct, earned) and <b>Kabir Senapati</b> (6 Oct, comp-off).',
  'Which compliance filings are due?':'In October: <b>TDS deposit by 7 Oct</b>, <b>PF ECR and ESI by 15 Oct</b>, and Odisha PT return by 21 Oct. I can prepare the PF ECR file for you to review.',
  'Why did net pay rise for Vikram?':'Vikram\'s CTC was revised from 1 August. September includes <b>₹41,200 arrears</b> for August, so net pay is 34% higher this month only.',
  'How many leaves do I have?':'You have <b>5 casual</b>, <b>6 sick</b> and <b>11 earned</b> leaves left this year.',
  'Apply sick leave for tomorrow':'Ready to submit: <b>Sick leave, Tue 30 Sep, 1 day</b>, to Kabir Senapati. <br><br>Reply "confirm" to send it. Nothing is submitted without your confirmation.',
  'When is my next payday?':'Tomorrow, <b>30 September</b>. Your payslip will be in the app by 9 AM.',
};

// ---------- Render ----------
function pageContent(){
  if(S.role==='hr') return ({dashboard,employees,attendance,payroll,performance,meetings,notifications,customise}[S.page]||dashboard)();
  return ({hub,requests,calendar:attendanceCal,feed,meetings}[S.page]||hub)();
}
let drawer='';
function render(){
  const app=$('#app');
  app.innerHTML = S.view==='auth' ? authView() : shell(pageContent()) + drawer;
  if(S.aiOpen){const b=$('#aiBody'); if(b) b.scrollTop=b.scrollHeight;}
  tick();
}
function tick(){const c=$('#clock'); if(!c) return; const d=new Date(); c.textContent=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});}
setInterval(tick, 15000);

function go(page){S.page=page;S.sideOpen=false;drawer='';render();window.scrollTo(0,0)}

document.addEventListener('click', e=>{
  const t=e.target.closest('button,a,[data-close]'); if(!t) return;
  const d=t.dataset;
  if(d.close && e.target.closest('[data-close]')===t && (t.classList.contains('scrim')?e.target===t:true)){drawer='';render();return}
  if(d.page){go(d.page);return}
  if(d.role){S.role=d.role;S.page=d.role==='hr'?'dashboard':'hub';render();toast(d.role==='hr'?'Viewing as HR admin':'Viewing as employee (Priya Das)');return}
  if(d.dept){S.deptFilter=d.dept;render();return}
  if(d.app||d.rej){const id=+(d.app||d.rej);const a=S.approvals.find(x=>x.id===id);S.approvals=S.approvals.filter(x=>x.id!==id);render();toast(`${d.app?'Approved':'Rejected'}: ${a.who}, ${a.type.toLowerCase()}`);return}
  if(d.lapp||d.lrej){const l=S.leaves.find(x=>x.id===+(d.lapp||d.lrej));l.status=d.lapp?'Approved':'Rejected';render();toast(`${l.status}: ${l.who}'s leave`);return}
  if(d.mod){S.modules[d.mod]=!S.modules[d.mod];render();toast(`${d.mod} ${S.modules[d.mod]?'switched on':'switched off'}`);return}
  if(d.color){const [a,b,rgb]=d.color.split('|');const r=document.documentElement.style;r.setProperty('--acc',a);r.setProperty('--acc2',b);r.setProperty('--acc-rgb',rgb);render();toast('Brand colour updated');return}
  if(d.mood){S.mood=d.mood;render();toast('Thanks for checking in');return}
  if(d.like){S.posts[+d.like].likes++;render();return}
  if(d.join){toast(`Opening ${d.join}… (prototype)`);return}
  if(d.launch){toast(`Opening ${d.launch} with single sign-on (prototype)`);return}
  if(d.tpl){toast(`${d.tpl} form opened with your details filled in (prototype)`);return}
  if(d.ask){askAI(d.ask);return}
  switch(d.act){
    case 'authswap': e.preventDefault(); S.authMode=S.authMode==='login'?'signup':'login'; render(); break;
    case 'sso': S.view='app'; render(); toast('Signed in with single sign-on'); break;
    case 'logout': S.view='auth'; S.authMode='login'; render(); break;
    case 'menu': S.sideOpen=!S.sideOpen; render(); break;
    case 'addEmp': drawer=empDrawer(); render(); setTimeout(()=>$('#fn')&&$('#fn').focus(),50); break;
    case 'payNext': S.payStep=Math.min(5,S.payStep+1); render(); toast(S.payStep>=5?'Salaries disbursed; PF, ESI and TDS files generated':'Step complete'); break;
    case 'checkin': S.checkedIn=!S.checkedIn; S.checkInAt=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); render(); toast(S.checkedIn?'Checked in. Have a good day!':'Checked out'); break;
    case 'addStep': S.flow.splice(S.flow.length-1,0,'Department head'); render(); toast('Step added to workflow'); break;
    case 'publish': toast('Changes published to all employees'); break;
    case 'undo': toast('Last change undone'); break;
    case 'readall': S.notifs=[]; render(); toast('All caught up'); break;
    case 'sync': toast('12 new punches synced from 2 devices'); break;
    case 'ai': S.aiOpen=!S.aiOpen; render(); break;
    case 'rate': toast('Thanks, your feedback is anonymous'); break;
    default: if(d.act) toast('This action is part of the full product (prototype)');
  }
});
document.addEventListener('change', e=>{
  if(e.target.dataset.task!==undefined){const i=+e.target.dataset.task;S.tasks[i].d=e.target.checked;render();}
});
document.addEventListener('input', e=>{
  if(e.target.id==='empq'){S.q=e.target.value;const pos=e.target.selectionStart;render();const i=$('#empq');i.focus();i.setSelectionRange(pos,pos);}
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='authForm'){
    const em=$('#em').value.trim(), pw=$('#pw').value;
    if(!/^\S+@\S+\.\S+$/.test(em)){$('#authErr').textContent='Enter a work email like name@company.com.';return}
    if(pw.length<6){$('#authErr').textContent='Password needs at least 6 characters.';return}
    if(S.authMode==='signup'){S.company=$('#co').value.trim()||S.company}
    S.view='app'; S.page='dashboard'; render(); toast(S.authMode==='signup'?'Workspace created with Odisha policy templates':'Signed in');
  }
  if(f.id==='empForm'){
    const n=$('#fn').value.trim(), em=$('#fe').value.trim();
    if(!n){$('#empErr').textContent='Add the employee\'s full name.';return}
    if(!/^\S+@\S+\.\S+$/.test(em)){$('#empErr').textContent='Add a valid work email so we can send the invite.';return}
    const id='CM-'+(1001+S.employees.length);
    S.employees.unshift({id,name:n,email:em,dept:$('#fd').value,role:$('#fr').value||'New joiner',loc:$('#fl').value,status:'Probation',joined:$('#fj').value});
    drawer=''; S.page='employees'; S.deptFilter='All'; S.q=''; render(); toast(`${n} added. Invite and onboarding checklist sent.`);
  }
  if(f.id==='fieldForm'){const v=$('#newField').value.trim(); if(!v) return; S.fields.push(v); render(); toast(`Field "${v}" added to every employee profile`);}
  if(f.id==='postForm'){const v=$('#postText').value.trim(); if(!v) return; S.posts.unshift({who:'Priya Das',init:'PD',time:'Just now',text:v,likes:0}); render(); toast('Posted to the company feed');}
  if(f.id==='aiForm'){const v=$('#aiIn').value.trim(); if(v) askAI(v);}
});
function askAI(q){
  S.aiMsgs.push({r:'me',t:esc(q)});
  let a = AI[q];
  if(!a && /confirm/i.test(q)) a='Done. Sick leave for 30 Sep sent to Kabir Senapati. Your team calendar is updated.';
  if(!a) a='In the full product I would look this up in your company data, within your permissions. This prototype answers the suggested questions.';
  S.aiMsgs.push({r:'bot',t:a}); render(); const i=$('#aiIn'); i&&i.focus();
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if(drawer){drawer='';render()} else if(S.aiOpen){S.aiOpen=false;render()} } });

render();
})();
</script>

</body>
</html>
